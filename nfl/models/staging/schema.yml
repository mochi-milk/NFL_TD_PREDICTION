version: 2
models:
  - name: stg_plays
    columns:
      - name: play_key
        data_tests: [unique, not_null]   # every play has its own ID
      - name: play_type
        data_tests:
          - accepted_values:
              values: ['run', 'pass']
  - name: stg_rosters
    columns:
      - name: player_id
        data_tests: [not_null]
      - name: player_name
        data_tests: [not_null]
  - name: stg_schedules
    columns:
      - name: game_id
        data_tests: [unique, not_null]   # every game appears once